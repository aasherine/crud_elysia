<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{nama}} — GirlyStuff</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-pink-50 min-h-screen text-pink-950">
    <header
      class="bg-gradient-to-r from-pink-400 to-fuchsia-400 text-white p-4 flex items-center gap-4"
    >
      <a href="/" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-xl text-sm no-underline text-white">← Kembali</a>
      <h1 class="text-xl font-bold flex-1 text-center">GirlyStuff 🎀</h1>
    </header>
    <main class="max-w-3xl mx-auto p-4">
      <div class="bg-white rounded-3xl shadow overflow-hidden">
        <img
          src="{{foto_url}}"
          onerror="this.src='https://picsum.photos/seed/{{id}}/400/400'"
          class="w-full h-64 object-cover"
        />
        <div class="p-6 grid gap-2">
          <p class="text-xs text-pink-400 uppercase tracking-wider">{{kategori}}</p>
          <h2 class="text-2xl font-bold">{{nama}}</h2>
          <p class="text-lg text-pink-600 font-semibold">Rp{{harga}}</p>
          <p class="text-sm text-gray-600">
            Stok: <span class="font-bold">{{stok}}</span>
          </p>
          <p class="text-gray-700">{{deskripsi}}</p>
          <a href="/" class="inline-block mt-4 bg-pink-500 hover:bg-pink-600 text-white rounded-xl px-6 py-2 no-underline">Kembali ke toko</a>
        </div>
      </div>
    </main>
  </body>
</html>
