<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GirlyStuff 🎀 Aksesoris Perempuan</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-pink-50 min-h-screen text-pink-950 font-sans">
    
    <!-- HEADER -->
    <header class="bg-gradient-to-r from-pink-400 to-fuchsia-400 text-white p-6 text-center shadow-md">
      <h1 class="text-3xl font-bold tracking-wide">🎀 GirlyStuff</h1>
      <p class="text-pink-100 text-sm mt-1">Toko aksesoris girly - Tugas CRUD</p>
    </header>

    <main class="max-w-5xl mx-auto p-4">
      
      <!-- FORM INPUT -->
      <form
        id="f"
        class="bg-white rounded-2xl shadow-md p-5 grid gap-3 md:grid-cols-7 mb-6 border border-pink-100"
      >
        <input
          id="nama"
          required
          placeholder="nama produk"
          class="border border-pink-200 rounded-xl px-3 py-2 md:col-span-2 focus:outline-none focus:ring-2 focus:ring-pink-400"
        />
        
        <select id="kategori" class="border border-pink-200 rounded-xl px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-pink-400">
          <option value="Jepit rambut">Jepit rambut</option>
          <option value="Scrunchie">Scrunchie</option>
          <option value="Kalung">Kalung</option>
          <option value="Gelang">Gelang</option>
          <option value="Anting">Anting</option>
          <option value="Cincin">Cincin</option>
          <option value="Tas mini">Tas mini</option>
          <option value="Kaca">Kaca</option>
        </select>

        <input
          id="harga"
          type="number"
          min="0"
          required
          placeholder="harga (IDR)"
          class="border border-pink-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400"
        />
        <input
          id="stok"
          type="number"
          min="0"
          required
          placeholder="stok"
          class="border border-pink-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400"
        />
        <input
          id="foto_url"
          placeholder="foto url (opsional)"
          class="border border-pink-200 rounded-xl px-3 py-2 md:col-span-2 focus:outline-none focus:ring-2 focus:ring-pink-400"
        />
        <input
          id="deskripsi"
          placeholder="deskripsi produk"
          class="border border-pink-200 rounded-xl px-3 py-2 md:col-span-5 focus:outline-none focus:ring-2 focus:ring-pink-400"
        />
        <button
          class="bg-pink-500 hover:bg-pink-600 text-white font-medium rounded-xl px-4 py-2 md:col-span-2 transition-all shadow-sm"
          id="btn"
        >
          + tambah
        </button>
      </form>

      <!-- BAR PILIHAN MATA UANG -->
      <div class="flex justify-between items-center mb-4 px-1">
        <h2 class="text-lg font-bold text-pink-800">Daftar Produk</h2>
        <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-pink-100">
          <label for="currency" class="text-xs font-semibold text-pink-600">Mata Uang:</label>
          <select id="currency" onchange="load()" class="bg-transparent text-sm font-bold text-pink-800 focus:outline-none cursor-pointer">
            <option value="IDR">IDR (Rupiah)</option>
            <option value="EUR">EUR (Euro €)</option>
          </select>
        </div>
      </div>

      <!-- GRID PRODUK -->
      <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>

    </main>

    <script>
      let editId = null;
      const grid = document.getElementById("grid");
      const f = document.getElementById("f");
      const btn = document.getElementById("btn");

      // Konversi Mata Uang & Formatter
      const KURS_EUR = 17000; // Asumsi 1 EUR = Rp 17.000

      function formatHarga(nilai) {
        const selectedCurrency = document.getElementById("currency") ? document.getElementById("currency").value : "IDR";
        
        if (selectedCurrency === "EUR") {
          const eurValue = nilai / KURS_EUR;
          return new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(eurValue);
        }
        
        // Default IDR
        return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(nilai);
      }

      async function load() {
        const d = await (await fetch("/api/products")).json();
        grid.innerHTML = d
          .map(
            (p) => `
          <div class="bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition-all">
            <div>
              <img
                src="${p.foto_url || "https://picsum.photos/seed/" + p.id + "/400/400"}"
                class="h-44 w-full object-cover"
                alt="${p.nama}"
              />
              <div class="p-4">
                <span class="text-[10px] font-bold uppercase tracking-wider bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full">
                  ${p.kategori}
                </span>
                <h3 class="font-bold text-pink-950 mt-1 text-base">${p.nama}</h3>
                
                <div class="flex items-center justify-between mt-2 mb-1">
                  <span class="text-sm font-extrabold text-pink-600">${formatHarga(p.harga)}</span>
                  <span class="text-xs text-gray-500 font-medium">stok: ${p.stok}</span>
                </div>

                <p class="text-xs text-gray-500 line-clamp-2 mt-1">${p.deskripsi || "-"}</p>
              </div>
            </div>

            <div class="p-3 pt-0 flex gap-1.5">
              <button onclick="edit(${p.id})" class="flex-1 bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-700 text-xs font-semibold rounded-lg py-1.5 transition">edit</button>
              <button onclick="del(${p.id})" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold rounded-lg py-1.5 transition">hapus</button>
              <a href="/products/${p.id}" class="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs font-semibold rounded-lg py-1.5 text-center no-underline transition">detail</a>
            </div>
          </div>
        `
          )
          .join("");
      }

      async function edit(id) {
        const p = await (await fetch("/api/products/" + id)).json();
        editId = id;
        nama.value = p.nama;
        kategori.value = p.kategori;
        harga.value = p.harga;
        stok.value = p.stok;
        deskripsi.value = p.deskripsi || "";
        foto_url.value = p.foto_url || "";
        btn.textContent = "💾 simpan";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function del(id) {
        if (!confirm("hapus produk ini?")) return;
        await fetch("/api/products/" + id, { method: "DELETE" });
        load();
      }

      f.onsubmit = async (e) => {
        e.preventDefault();
        const body = {
          nama: nama.value,
          kategori: kategori.value,
          harga: Number(harga.value),
          stok: Number(stok.value),
          deskripsi: deskripsi.value,
          foto_url: foto_url.value,
        };
        await fetch(editId ? "/api/products/" + editId : "/api/products", {
          method: editId ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        editId = null;
        btn.textContent = "+ tambah";
        f.reset();
        load();
      };

      load();
    </script>
  </body>
</html>
