<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GirlyStuff 🎀 — Aksesoris</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-pink-50 min-h-screen text-pink-950">
    <header
      class="bg-gradient-to-r from-pink-400 to-fuchsia-400 text-white p-6 text-center shadow"
    >
      <h1 class="text-3xl font-bold">🎀 GirlyStuff</h1>
      <p class="text-pink-100">toko aksesoris girly — tugas CRUD</p>
    </header>
    <main class="max-w-5xl mx-auto p-4">
      <form
        id="f"
        class="bg-white rounded-2xl shadow p-4 grid gap-2 md:grid-cols-7 mb-6"
      >
        <input
          id="nama"
          required
          placeholder="nama"
          class="border border-pink-200 rounded-xl px-3 py-2 md:col-span-2"
        />
        <select id="kategori" class="border border-pink-200 rounded-xl px-3 py-2">
          ${["Jepit rambut", "Scrunchie", "Kalung", "Gelang", "Anting", "Cincin", "Tas mini", "Kaca"]
            .map((k) => `<option>${k}</option>`)
            .join("")}
        </select>
        <input
          id="harga"
          type="number"
          min="0"
          required
          placeholder="harga"
          class="border border-pink-200 rounded-xl px-3 py-2"
        />
        <input
          id="stok"
          type="number"
          min="0"
          required
          placeholder="stok"
          class="border border-pink-200 rounded-xl px-3 py-2"
        />
        <input
          id="foto_url"
          placeholder="foto url (opsional)"
          class="border border-pink-200 rounded-xl px-3 py-2 md:col-span-2"
        />
        <input
          id="deskripsi"
          placeholder="deskripsi"
          class="border border-pink-200 rounded-xl px-3 py-2 md:col-span-5"
        />
        <button
          class="bg-pink-500 hover:bg-pink-600 text-white rounded-xl px-4 py-2 md:col-span-2"
          id="btn"
        >
          + tambah
        </button>
      </form>
      <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
    </main>
    <script>
      let editId = null;
      const grid = document.getElementById("grid");
      const f = document.getElementById("f");
      const btn = document.getElementById("btn");
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");

      async function load() {
        const d = await (await fetch("/api/products")).json();
        grid.innerHTML = d
          .map(
            (p) => `
          <div class="bg-white rounded-2xl shadow overflow-hidden">
            <img
              src="${p.foto_url || "https://picsum.photos/seed/" + p.id + "/400/400"}"
              class="h-40 w-full object-cover"
            />
            <div class="p-3">
              <p class="text-xs text-pink-400">${p.kategori}</p>
              <h3 class="font-bold">${p.nama}</h3>
              <p class="text-sm text-pink-600 font-semibold">${rp(p.harga)} · stok ${p.stok}</p>
              <p class="text-xs text-gray-500 truncate">${p.deskripsi || ""}</p>
              <div class="flex gap-2 mt-2">
                <button onclick="edit(${p.id})" class="flex-1 bg-fuchsia-100 rounded-lg py-1">edit</button>
                <button onclick="del(${p.id})" class="flex-1 bg-red-100 text-red-600 rounded-lg py-1">hapus</button>
                <a href="/products/${p.id}" class="flex-1 bg-pink-100 rounded-lg py-1 text-center no-underline text-pink-700">detail</a>
              </div>
            </div>
          </div>
        `
          )
          .join("");
      }

      async function edit(id) {
        const p = await (await fetch("/api/products/" + id)).json();
        editId = id;
        nama.value = p.nama;
        kategori.value = p.kategori;
        harga.value = p.harga;
        stok.value = p.stok;
        deskripsi.value = p.deskripsi || "";
        foto_url.value = p.foto_url || "";
        btn.textContent = "💾 simpan";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function del(id) {
        if (!confirm("hapus?")) return;
        await fetch("/api/products/" + id, { method: "DELETE" });
        load();
      }

      f.onsubmit = async (e) => {
        e.preventDefault();
        const body = {
          nama: nama.value,
          kategori: kategori.value,
          harga: Number(harga.value),
          stok: Number(stok.value),
          deskripsi: deskripsi.value,
          foto_url: foto_url.value,
        };
        await fetch(editId ? "/api/products/" + editId : "/api/products", {
          method: editId ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        editId = null;
        btn.textContent = "+ tambah";
        f.reset();
        load();
      };
      load();
    </script>
  </body>
</html>
